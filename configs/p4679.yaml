# p4679: quartz-powder gouge, Penn State double-direct shear (Supplementary Table 1 of the paper)
system: p4679
label: "p4679 (quartz powder)"
target_name: shear_stress_MPa
sampling_rate_hz: 3.84e6          # effective AE sampling rate (nominal 4 MHz)
recurrence_s: 5.57                # mean stick-slip interval T

paths:
  raw: data/raw/p4679
  outputs: outputs

raw:
  kind: pennstate
  start_s: 4340
  end_s: 4540
  channel: 0
  ac_dir: p4679ac/run1
  time_vector_file: p4679ac/acTime.txt
  settings_file: p4679ac/p4679_run1_AE.mat
  mechanical_file: p4679.txt

window: 450000                    # W, samples (0.117 s)
skip_rows: nan

embedding:
  S: 50000                        # 13.0 ms
  D: 125                          # L = 1.73 s
  n_pca: 3
  n_umap: 2
  n_neighbors: 200
  min_dist: 0.01
  umap_random_state: 0
  pca_random_state: 0

split:
  kind: fraction
  test_fraction: 0.2

model:
  n_estimators: 1000
  n_iter: 25
  cv: 3
  random_state: 0
  search_random_state: null
  feature_order: lab
  backend: darts

explain:
  shap_rows: all
  shap_decimation: 1
  n_jets: 8
