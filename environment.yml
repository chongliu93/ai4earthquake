# conda env create -f environment.yml && conda activate labquake
# Versions are those used for the paper.
name: labquake
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.13.1
  - scikit-learn=1.6.1
  - h5py=3.14.0
  - pyyaml=6.0.*
  - pip
  - pip:
      - darts==0.37.1
      - umap-learn==0.5.12
      - shap==0.49.1
      - scikit-optimize==0.10.2
      - -e .
